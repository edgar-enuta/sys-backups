include hyde.conf

# Use Alt as kitty modifier instead of default Ctrl+Shift
# (frees Ctrl+Shift+Arrow for zsh word selection)
kitty_mod alt

# Minimal Tab bar styling
tab_bar_edge                bottom
tab_bar_style               powerline
tab_powerline_style         slanted
tab_title_template          {title}{' :{}:'.format(num_windows) if num_windows > 1 else ''}

# Explicitly bind Alt+T to new tab (kitty_mod+alt+t rename binding
# collapses to the same key when kitty_mod is alt, stealing this combo)
map alt+t new_tab_with_cwd
map kitty_mod+shift+t set_tab_title

# Uncomment the following 4 lines to minimize kitty latency (higher energy usage)
 input_delay 0
# repaint_delay 2
# sync_to_monitor no
 wayland_enable_ime no

font_size 11.0
map shift+enter send_text all \e\r

# Open scrollback buffer in pager (less) for keyboard navigation
# Use: j/k or arrows to scroll, / to search, q to quit
map kitty_mod+s show_scrollback

# Preserve Ctrl+Shift+C/V for copy/paste (universal terminal muscle memory)
map ctrl+shift+c copy_to_clipboard
map ctrl+shift+v paste_from_clipboard

# Directional window focus navigation (for splits created with alt+enter)
map alt+shift+up neighboring_window up
map alt+shift+down neighboring_window down
map alt+shift+left neighboring_window left
map alt+shift+right neighboring_window right
